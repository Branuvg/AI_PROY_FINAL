project: ai_proy_final
initialized: 2026-05-24
sdd_mode: hybrid

context: |
  Python Jupyter notebook project: Texas Hold'em poker AI comparison.
  Single notebook: poker_ia_comparativa_final.ipynb.
  Implements Minimax (alpha-beta + world sampling), Bayesian network (pgmpy),
  Markov chains (Bellman value function), TD/Q-Learning, Ensemble (weighted vote).
  Stack: Python 3.12 (dev ran on 3.12.8), treys, pgmpy, numpy, pandas,
  matplotlib, seaborn, tqdm. Runtime env (this machine): Python 3.14 — deps
  not installed globally; virtual env or conda env required to run.
  Known concerns: simulator simplification (2 actions/street max, no re-raises),
  questionable ROI metric formula, Markov env-favored result (88% WR vs Random),
  TD learned only 119 Q-states (very sparse), Ensemble is slow (250 ms+/decision).

strict_tdd: false

