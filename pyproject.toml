[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-ai"
version = "0.1.0"
description = "Importable poker AI engine and evaluation helpers"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pandas",
  "treys",
  "pgmpy",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "jupyterlab>=4",
  "nbconvert>=7",
  "ipykernel>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
